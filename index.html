<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroMarket</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🌱 AgroMarket</h1>
        <p>Conectando o Campo à Cidade</p>
    </header>

    <main>
        <section class="produtos">
            <div class="produto">
                <img src="https://via.placeholder.com/200" alt="Tomate">
                <h2>Tomate</h2>
                <p>R$ 8,00/kg</p>
                <button onclick="comprar('Tomate')">Comprar</button>
            </div>

            <div class="produto">
                <img src="https://via.placeholder.com/200" alt="Milho">
                <h2>Milho</h2>
                <p>R$ 5,00/kg</p>
                <button onclick="comprar('Milho')">Comprar</button>
            </div>

            <div class="produto">
                <img src="https://via.placeholder.com/200" alt="Soja">
                <h2>Soja</h2>
                <p>R$ 4,50/kg</p>
                <button onclick="comprar('Soja')">Comprar</button>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 AgroMarket - Projeto Agrinho</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
