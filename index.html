<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loja de Tênis</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Sneaker Store</h1>
    <a href="carrinho.html" class="btn-carrinho">
        🛒 Carrinho (<span id="contador">0</span>)
    </a>
</header>

<section class="banner">
    <h2>Os Melhores Tênis do Mercado</h2>
    <p>Ofertas exclusivas para você.</p>
</section>

<section class="produtos">

    <div class="produto">
        <img src="imagens/nike-air-max.jpg" alt="Nike Air Max">
        <h3>Nike Air Max</h3>
        <p>R$ 699,90</p>
        <button onclick="adicionarCarrinho('Nike Air Max',699.90,'imagens/nike-air-max.jpg')">
            Adicionar ao Carrinho
        </button>
    </div>

    <div class="produto">
        <img src="imagens/adidas-ultraboost.jpg" alt="Adidas Ultraboost">
        <h3>Adidas Ultraboost</h3>
        <p>R$ 799,90</p>
        <button onclick="adicionarCarrinho('Adidas Ultraboost',799.90,'imagens/adidas-ultraboost.jpg')">
            Adicionar ao Carrinho
        </button>
    </div>

    <div class="produto">
        <img src="imagens/puma-rsx.jpg" alt="Puma RS-X">
        <h3>Puma RS-X</h3>
        <p>R$ 549,90</p>
        <button onclick="adicionarCarrinho('Puma RS-X',549.90,'imagens/puma-rsx.jpg')">
            Adicionar ao Carrinho
        </button>
    </div>

    <div class="produto">
        <img src="imagens/jordan1.jpg" alt="Air Jordan 1">
        <h3>Air Jordan 1</h3>
        <p>R$ 1.199,90</p>
        <button onclick="adicionarCarrinho('Air Jordan 1',1199.90,'imagens/jordan1.jpg')">
            Adicionar ao Carrinho
        </button>
    </div>

</section>

<script src="script.js"></script>

</body>
</html>
